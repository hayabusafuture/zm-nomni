<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — Create HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
<style>
  :root {
    --nomni-green: #2AC864;
    --seaweed: #0E3727;
    --spinach: #1A8040;
    --mint: #E2FFE6;
    --ink: #1a1f2b;
    --ink-2: #4a4f5a;
    --ink-mute: #8a8f98;
    --ink-soft: #c7c9cf;
    --rule: #e7e8ec;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Inter", system-ui, sans-serif; color: var(--ink); font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased; background: #fff; }
  .app { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 56px 1fr; min-height: 100vh; }

  /* ── Topbar ── */
  .topbar { grid-column: 1/-1; grid-row: 1; background: #1F2226; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; border-bottom: 1px solid #000; position: sticky; top: 0; z-index: 5; }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .topbar-right { display: flex; align-items: center; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-logo-img { height: 26px; }
  .brand-sub { color: var(--nomni-green); font-weight: 400; font-size: 23px; font-family: "Hanken Grotesk", sans-serif; line-height: 1; }
  .topbar-avt { width: 32px; height: 32px; border-radius: 50%; background: var(--nomni-green); color: var(--seaweed); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; font-family: "Hanken Grotesk", sans-serif; }
  .user { display: flex; align-items: center; gap: 10px; color: #fff; cursor: pointer; user-select: none; }
  .chev { width: 10px; height: 10px; display: inline-block; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg) translate(-1px,-1px); }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .help-btn { background: transparent; border: none; color: rgba(255,255,255,.7); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 6px; transition: background .15s, color .15s; text-decoration: none; font-size: 14px; }
  .help-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
  .help-btn .material-symbols-outlined { font-size: 18px; line-height: 1; }

  /* ── Sidebar — dark green ── */
  .sidebar { grid-column: 1; grid-row: 2; background: var(--seaweed); display: flex; flex-direction: column; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; }
  .nav { padding: 8px 0; flex: 1; }
  .nav-section-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.28); padding: 14px 16px 4px; line-height: 1; }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 8px 16px; color: rgba(255,255,255,.55); text-decoration: none; font-size: 14px; font-weight: 400; transition: background .15s, color .15s; border-left: 2px solid transparent; white-space: nowrap; }
  .nav a svg { flex-shrink: 0; transition: color .15s; color: rgba(255,255,255,.3); }
  .nav a:hover { color: rgba(255,255,255,.9); background: rgba(255,255,255,.06); }
  .nav a:hover svg { color: rgba(255,255,255,.6); }
  .nav a.active { color: #fff; background: rgba(42,200,100,.12); border-left-color: var(--nomni-green); font-weight: 500; padding-left: 14px; }
  .nav a.active svg { color: var(--nomni-green); }
  .nav .badge { margin-left: auto; background: var(--nomni-green); color: var(--seaweed); font-size: 10px; font-weight: 700; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

  /* ── Main ── */
  .main { grid-column: 2; grid-row: 2; padding: 28px 40px 100px; min-width: 0; background: #fff; }

  /* Breadcrumb */
  .breadcrumb { margin-bottom: 10px; }
  .back-link { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-mute); font-size: 14px; font-weight: 500; text-decoration: none; transition: color .13s; }
  .back-link:hover { color: var(--seaweed); }

  /* Page title */
  .page-title { font-size: 24px; font-weight: 700; margin: 0 0 16px; letter-spacing: -0.03em; font-family: "Inter", system-ui, sans-serif; }
  .title-divider { height: 1px; background: var(--rule); margin: 0 0 28px; }

  /* Form body */
  .form-body { max-width: 640px; margin: 0 auto; }

  /* Section headings */
  .section-heading { font-size: 18px; font-weight: 700; margin: 0 0 16px; letter-spacing: -0.02em; color: var(--ink); }
  .section-divider { height: 1px; background: var(--rule); margin: 28px 0; }

  /* Fields */
  .form-row { display: flex; gap: 16px; margin-bottom: 16px; }
  .form-row .field-group { flex: 1; margin-bottom: 0; }
  .field-group { margin-bottom: 16px; }
  .field-label { display: block; font-size: 14px; font-weight: 500; color: var(--ink); margin-bottom: 6px; }
  .field-label .optional { font-size: 12px; font-weight: 400; color: var(--ink-mute); margin-left: 4px; }
  .field-input { width: 100%; padding: 8px 12px; border: 1px solid #dcdee3; border-radius: 6px; font: inherit; font-size: 14px; color: var(--ink); outline: none; transition: border-color .13s; background: #fff; }
  .field-input:focus { border-color: var(--nomni-green); }
  .field-input::placeholder { color: var(--ink-mute); }
  .field-input:disabled { background: #f3f4f6; color: var(--ink-mute); cursor: not-allowed; }
  .field-hint { font-size: 12px; color: var(--ink-mute); margin-top: 4px; display: block; line-height: 1.5; }
  .field-select { width: 100%; padding: 8px 28px 8px 12px; border: 1px solid #dcdee3; border-radius: 6px; font: inherit; font-size: 14px; color: var(--ink); outline: none; appearance: none; cursor: pointer; background: #fff url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238a8f98' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right 10px center; transition: border-color .13s; }
  .field-select:focus { border-color: var(--nomni-green); }
  .field-select:disabled { background-color: #f3f4f6; color: var(--ink-mute); cursor: not-allowed; }

  /* File row */
  .file-row { display: flex; border: 1px solid #dcdee3; border-radius: 6px; overflow: hidden; }
  .file-display { flex: 1; padding: 8px 12px; font-size: 14px; color: var(--ink-mute); background: #fff; border: none; outline: none; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .browse-btn { padding: 8px 16px; background: var(--nomni-green); color: var(--seaweed); font: inherit; font-size: 14px; font-weight: 600; border: none; cursor: pointer; flex-shrink: 0; transition: background .15s; }
  .browse-btn:hover { background: #22b055; }

  /* Radio rows */
  .radio-group { display: flex; flex-direction: column; gap: 10px; }
  .radio-row { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
  .radio-row input[type="radio"] { width: 16px; height: 16px; margin-top: 1px; accent-color: var(--nomni-green); flex-shrink: 0; cursor: pointer; }
  .radio-row-text { flex: 1; }
  .radio-row-label { font-size: 14px; font-weight: 500; color: var(--ink); line-height: 1.4; }
  .radio-row-desc { font-size: 12px; color: var(--ink-mute); margin-top: 2px; line-height: 1.4; }
  .radio-row-warning { font-size: 12px; color: #D0291E; margin-top: 2px; }

  /* Indented sub-field under a radio */
  .radio-indent { padding-left: 26px; margin-top: 8px; }

  /* Subscription plan cards */
  .plan-cards { display: flex; flex-direction: column; gap: 8px; }
  .plan-card { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 8px; cursor: pointer; transition: border-color .15s, background .15s; }
  .plan-card:has(input:checked) { border-color: var(--nomni-green); background: #F6FFF9; }
  .plan-card input[type="radio"] { width: 16px; height: 16px; margin-top: 1px; accent-color: var(--nomni-green); flex-shrink: 0; cursor: pointer; }
  .plan-card-body { flex: 1; }
  .plan-card-name { font-size: 14px; font-weight: 600; color: var(--ink); }
  .plan-card-desc { font-size: 12px; color: var(--ink-mute); margin-top: 2px; }
  .plan-card-billing { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .plan-card-billing select { padding: 4px 24px 4px 8px; border: 1px solid #dcdee3; border-radius: 5px; font: inherit; font-size: 14px; color: var(--ink); outline: none; appearance: none; cursor: pointer; background: #fff url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238a8f98' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right 6px center; }
  .plan-card-billing label { font-size: 14px; color: var(--ink-mute); }
  .plan-badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; border-radius: 4px; padding: 2px 7px; margin-left: 6px; }
  .plan-badge-free { background: #D9F5E4; color: var(--spinach); }

  /* Checkbox items */
  .check-item { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; padding: 3px 0; }
  .check-item input[type="checkbox"] { width: 14px; height: 14px; margin-top: 1px; accent-color: var(--nomni-green); flex-shrink: 0; cursor: pointer; }
  .check-item-text { flex: 1; }
  .check-item-label { font-size: 14px; color: var(--ink); line-height: 1.4; }
  .check-item-warning { font-size: 12px; color: #D0291E; margin-top: 1px; line-height: 1.4; }
  .check-list { display: flex; flex-direction: column; gap: 10px; }

  /* Cuisine grid */
  .cuisine-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; }

  /* User menu */
  .user-wrap { position: relative; }
  .user-menu { position: absolute; top: calc(100% + 8px); right: 0; width: 248px; background: #fff; color: var(--ink); border-radius: 10px; box-shadow: 0 14px 40px rgba(10,20,15,.22), 0 2px 8px rgba(10,20,15,.08); display: none; z-index: 200; overflow: hidden; }
  .user-menu.open { display: block; }
  .user-menu-header { padding: 14px 16px 12px; }
  .user-menu-name { font-size: 14px; font-weight: 600; }
  .user-menu-email { font-size: 12px; color: var(--ink-mute); margin-top: 2px; }
  .user-menu-divider { height: 1px; background: var(--rule); }
  .user-menu-section { padding: 6px 0; }
  .user-menu-item { display: flex; align-items: center; gap: 10px; padding: 9px 16px; font-size: 14px; color: var(--ink); text-decoration: none; cursor: pointer; transition: background .1s; white-space: nowrap; }
  .user-menu-item:hover { background: #f3f4f6; }
  .user-menu-item.logout { color: #e53535; }

  /* Sticky footer */
  .sticky-footer { position: fixed; bottom: 0; left: 220px; right: 0; background: #fff; border-top: 1px solid var(--rule); padding: 12px 40px; display: flex; align-items: center; justify-content: space-between; z-index: 10; }
  .cancel-link { font-size: 14px; font-weight: 600; color: var(--ink-mute); cursor: pointer; background: none; border: none; font-family: inherit; text-decoration: none; transition: color .13s; }
  .cancel-link:hover { color: var(--ink); }
  .save-btn { background: var(--nomni-green); color: var(--seaweed); border: none; border-radius: 6px; font: inherit; font-size: 14px; font-weight: 600; padding: 9px 24px; cursor: pointer; transition: background .15s; }
  .save-btn:hover { background: #22b055; }

  /* Conditional sub-panels */
  .conditional-panel { display: none; }
  .conditional-panel.visible { display: block; }

  @media (max-width: 1280px) {
    .app { grid-template-columns: 56px 1fr; }
    .sidebar { position: fixed; top: 56px; left: 0; width: 56px; height: calc(100vh - 56px); overflow: hidden; transition: width 0.2s ease; z-index: 4; }
    .sidebar:hover { width: 220px; box-shadow: 2px 0 16px rgba(0,0,0,.25); }
    .nav a span { display: none; }
    .nav a.active { padding-left: 16px; border-left-width: 0; }
    .sidebar:hover .nav a span { display: inline; }
    .sidebar:hover .nav a.active { padding-left: 14px; border-left-width: 2px; }
    .sticky-footer { left: 56px; }
  }

  /* Procure-style Admin side navigation */
  .app { grid-template-columns: 232px 1fr; }
  .sidebar { background: #F5F5F5; color: #1A1F2B; }
  .nav { margin-top: 4px; padding: 6px 10px; flex: 1; }
  .nav a { gap: 12px; padding: 10px 12px; min-height: 40px; box-sizing: border-box; color: #1A1F2B; border: 0; border-radius: 6px; font-size: 14px; font-weight: 400; transition: background .15s, color .15s; }
  .nav a svg { width: 18px; height: 18px; color: #888; transition: color .15s; }
  .nav a:hover { color: #1A1F2B; background: rgba(0,0,0,.05); }
  .nav a:hover svg { color: #888; }
  .nav a.active { color: var(--seaweed); background: rgba(42,200,100,.14); border: 0; font-weight: 600; padding-left: 12px; }
  .nav a.active svg { color: var(--spinach); }
  .nav a .icon-wrap { flex: 0 0 18px; width: 18px; height: 18px; position: relative; display: block; }
  .nav a .icon { position: absolute; top: 0; left: 0; width: 18px; height: 18px; color: #888888; transition: color .15s ease; }
  .nav a .icon-green { display: none; }
  .nav a.active .icon-grey { display: none; }
  .nav a.active .icon-green { display: block; }
  .nav a:hover .icon { color: #888; }
  .nav a.active .icon { color: var(--spinach); }
  .nav .badge { background: var(--nomni-green); color: var(--seaweed); }
  .sidebar-foot { border-top-color: #E7E8EC; }
  .sidebar-avt { background: #7F6AD0; color: #fff; }
  .sidebar-uname { color: #1A1F2B; }
  .sidebar-role-lbl { color: #8A8F98; }
   @media (max-width: 1280px) {
    .app { grid-template-columns: 64px 1fr; }
    .sidebar { width: 64px; }
    .sidebar:hover { width: 232px; box-shadow: 2px 0 12px rgba(0,0,0,.12); }
    .nav a, .nav a.active { padding: 10px 12px; border: 0; }
    .nav .badge { min-width: 8px; width: 8px; height: 8px; padding: 0; font-size: 0; margin-left: 4px; }
    .sidebar:hover .nav .badge { min-width: 18px; width: auto; height: 18px; padding: 0 5px; font-size: 10px; margin-left: auto; }
  }

  /* Nomni Green Procure Admin top bar */
  .topbar { background: var(--nomni-green); color: var(--seaweed); border-bottom: none; box-shadow: none; }
  .brand-sub { color: var(--seaweed); font-size: 21px; font-weight: 500; }
  .topbar .user { color: var(--seaweed); }
  .topbar-avt, .topbar .avatar { background: var(--seaweed); color: var(--nomni-green); }
  .help-btn { color: rgba(14,55,39,.78); }
  .help-btn:hover { background: rgba(14,55,39,.10); color: var(--seaweed); }
  .font-inspector-btn { border-color: rgba(14,55,39,.28); color: rgba(14,55,39,.68); }
  .font-inspector-btn:hover { background: rgba(14,55,39,.10); color: var(--seaweed); }

/* Freemium-aligned action buttons */
.btn-primary {
  min-height: 40px;
  padding: 0 16px;
  border: 1px solid var(--nomni-green);
  border-radius: 6px;
  background: var(--nomni-green);
  color: var(--seaweed);
  font-size: 14px;
  font-weight: 600;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  white-space: nowrap;
  transition: background-color .18s ease, color .18s ease, border-color .18s ease, transform .16s ease;
}
.btn-primary:hover:not(:disabled) {
  background: var(--seaweed);
  color: var(--nomni-green);
  border-color: var(--seaweed);
}
.btn-primary:active:not(:disabled) { transform: scale(.96); }

.btn-secondary,
.btn-tertiary {
  min-height: 40px;
  padding: 0 16px;
  border: 1px solid #E2FFE6;
  border-radius: 6px;
  background: #E2FFE6;
  color: var(--seaweed);
  font-size: 14px;
  font-weight: 600;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  white-space: nowrap;
  transition: background-color .18s ease, border-color .18s ease, transform .16s ease;
}
.btn-secondary:hover:not(:disabled),
.btn-tertiary:hover:not(:disabled) {
  background: #C6F2CE;
  border-color: #C6F2CE;
}
.btn-secondary:active:not(:disabled),
.btn-tertiary:active:not(:disabled) { transform: scale(.96); }


/* Create HQ validation */
.field-input.is-invalid,
.field-select.is-invalid { border-color: #D0291E; }
.field-error { display:none; margin-top:6px; color:#D0291E; font-size:12px; }
.field-error.show { display:block; }


/* Freemium dialog title scale */
.modal-title,
.dialog-title,
.danger-confirm-title,
.confirm-title,
.confirm-card-title,
[role="dialog"] h2 {
  margin-top: 0;
  font-size: 21px !important;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -.02em;
}

</style>
</head>

        <span>Orders</span>
      </a>
      <a href="#">

        <span>Invoices</span>
      </a>
      <a href="#">
        <span class="icon-wrap"><img class="icon icon-grey" src="sidenav icons/Reports - grey.png" alt="" aria-hidden="true"><img class="icon icon-green" src="sidenav icons/Reports - green.png" alt="" aria-hidden="true"></span>
        <span>Reports</span>
      </a>
      <a href="#">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12V22H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
        <span>Promotions</span>
      </a>
      <a href="Admin - Buyers.html" class="active">

        <span>Buyers</span>

        <span>Suppliers</span>
      </a>
      <a href="#">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span>Notifications</span><span class="badge">4</span>

<script>
  // User menu
  document.getElementById('userMenuBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    document.getElementById('userMenu').classList.toggle('open');
  });
  document.addEventListener('click', function() {
    document.getElementById('userMenu').classList.remove('open');
  });

</script>

<script>
function setCreateFieldError(field, message) {
  var group = field.closest('.field-group');
  var error = group.querySelector('.field-error');
  if (!error) {
    error = document.createElement('div');
    error.className = 'field-error';
    group.appendChild(error);
  }
  error.textContent = message;
  error.classList.add('show');
  field.classList.add('is-invalid');
}

function clearCreateErrors() {
  document.querySelectorAll('.field-error').forEach(function(error) { error.classList.remove('show'); });
  document.querySelectorAll('.is-invalid').forEach(function(field) { field.classList.remove('is-invalid'); });
}

function createHQ() {
  clearCreateErrors();
  var company = document.getElementById('hqCompany');
  var name = document.getElementById('hqName');
  var firstInvalid = null;

  if (!company.value) {
    setCreateFieldError(company, 'Select a company.');
    firstInvalid = firstInvalid || company;
  }
  if (!name.value.trim()) {
    setCreateFieldError(name, 'Enter an HQ name.');
    firstInvalid = firstInvalid || name;
  }

  if (firstInvalid) {
    firstInvalid.focus();
    firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  var newHQ = {
    name: name.value.trim(),
    company: company.options[company.selectedIndex].text,
    createdAt: new Date().toISOString()
  };
  localStorage.setItem('nomniNewHQ', JSON.stringify(newHQ));
  localStorage.setItem('nomniNewHQToastPending', '1');
  localStorage.removeItem('nomniHqPrototypeState');
  localStorage.removeItem('nomniNewOutletGroup');
  localStorage.removeItem('nomniNewOutletGroupToastPending');
  window.location.href = 'Admin - HQ Settings.html?new=1';
}

['hqCompany', 'hqName'].forEach(function(id) {
  document.getElementById(id).addEventListener('input', function() {
    this.classList.remove('is-invalid');
    var error = this.closest('.field-group').querySelector('.field-error');
    if (error) error.classList.remove('show');
  });
});
</script>
