<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — HQ Users</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
<style>
  :root {
    --nomni-green: #2AC864;
    --seaweed: #0E3727;
    --spinach: #1A8040;
    --mint: #E2FFE6;
    --ink: #1a1f2b;
    --ink-2: #4a4f5a;
    --ink-mute: #8a8f98;
    --ink-soft: #c7c9cf;
    --rule: #e7e8ec;
    --row-hover: #f7f8fa;
    --primary: #2AC864;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Inter", system-ui, sans-serif; color: var(--ink); font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased; background: #fff; }
  .app { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 56px 1fr; min-height: 100vh; }

  /* ── Topbar ── */
  .topbar { grid-column: 1/-1; grid-row: 1; background: #1F2226; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; border-bottom: 1px solid #000; position: sticky; top: 0; z-index: 5; }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .topbar-right { display: flex; align-items: center; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-logo-img { height: 26px; }
  .brand-sub { color: var(--nomni-green); font-weight: 400; font-size: 23px; font-family: "Hanken Grotesk", sans-serif; line-height: 1; }
  .topbar-avt { width: 32px; height: 32px; border-radius: 50%; background: var(--nomni-green); color: var(--seaweed); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; font-family: "Hanken Grotesk", sans-serif; }
  .user { display: flex; align-items: center; gap: 10px; color: #fff; cursor: pointer; user-select: none; }
  .chev { width: 10px; height: 10px; display: inline-block; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg) translate(-1px,-1px); }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .help-btn { background: transparent; border: none; color: rgba(255,255,255,.7); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 6px; transition: background .15s, color .15s; text-decoration: none; font-size: 14px; }
  .help-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
  .help-btn .material-symbols-outlined { font-size: 18px; line-height: 1; }

  /* ── Sidebar ── */
  .sidebar { grid-column: 1; grid-row: 2; background: var(--seaweed); display: flex; flex-direction: column; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; }
  .nav { padding: 8px 0; flex: 1; }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 8px 16px; color: rgba(255,255,255,.55); text-decoration: none; font-size: 14px; font-weight: 400; transition: background .15s, color .15s; border-left: 2px solid transparent; white-space: nowrap; }
  .nav a svg { flex-shrink: 0; transition: color .15s; color: rgba(255,255,255,.3); }
  .nav a:hover { color: rgba(255,255,255,.9); background: rgba(255,255,255,.06); }
  .nav a:hover svg { color: rgba(255,255,255,.6); }
  .nav a.active { color: #fff; background: rgba(42,200,100,.12); border-left-color: var(--nomni-green); font-weight: 500; padding-left: 14px; }
  .nav a.active svg { color: var(--nomni-green); }
  .nav .badge { margin-left: auto; background: var(--nomni-green); color: var(--seaweed); font-size: 10px; font-weight: 700; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

  /* ── Main ── */
  .main { grid-column: 2; grid-row: 2; padding: 28px 40px 80px; min-width: 0; background: #fff; }

  /* ── Back link ── */
  .breadcrumb { margin-bottom: 10px; }
  .back-link { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-mute); font-size: 14px; font-weight: 500; text-decoration: none; transition: color .13s; }
  .back-link:hover { color: var(--seaweed); }

  /* ── Page head ── */
  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
  .page-title { font-size: 24px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.03em; font-family: "Inter", system-ui, sans-serif; }
  .page-meta { font-size: 13px; color: var(--ink-mute); }
  .title-divider { height: 1px; background: var(--rule); margin: 0 0 24px; }

  .filter-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .ml-search-wrap { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #dcdee3; border-radius: 6px; padding: 0 12px; height: 36px; min-width: 260px; }
  .ml-search-wrap:focus-within { border-color: var(--nomni-green); }
  .ml-search-input { border: none; outline: none; font: inherit; font-size: 14px; color: var(--ink); background: transparent; width: 100%; }
  .ml-search-input::placeholder { color: var(--ink-mute); }

  .ml-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
  .ml-table thead th { text-align: left; font-weight: 600; font-size: 12px; color: var(--ink-mute); padding: 10px 14px; border-bottom: 1px solid var(--rule); background: #fff; white-space: nowrap; }
  .ml-table tbody td { padding: 11px 14px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  .ml-table tbody tr:last-child td { border-bottom: none; }
  .ml-table tbody tr:hover td { background: var(--row-hover); }
  .ml-inactive { opacity: 0.45; }
  .ml-item-name { font-size: 14px; font-weight: 500; color: var(--ink); }
  .ml-item-sub { font-size: 12px; color: var(--ink-mute); margin-top: 2px; }

  .chip { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border-radius: 4px; padding: 3px 10px; }
  .chip-active { background: #D9F5E4; color: #1A8040; }
  .chip-inactive { background: #F0F0F2; color: #555; }
  .chip-owner { background: #EDE9FE; color: #6D28D9; }

  .row-actions-wrap { position: relative; display: inline-block; }
  .btn-row-actions { background: none; border: none; color: var(--ink-mute); cursor: pointer; padding: 4px 8px; border-radius: 4px; font-size: 18px; line-height: 1; letter-spacing: 1px; display: flex; align-items: center; transition: background .1s, color .1s; }
  .btn-row-actions:hover { background: #f0f1f3; color: var(--ink); }
  .row-actions-menu { display: none; position: absolute; right: 0; top: calc(100% + 4px); background: #fff; border: 1px solid #e0e2e8; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.12); z-index: 300; overflow: hidden; min-width: 170px; }
  .row-actions-menu.open { display: block; }
  .row-action-item { padding: 10px 16px; font-size: 14px; color: var(--ink); cursor: pointer; transition: background .1s; white-space: nowrap; }
  .row-action-item:hover { background: var(--mint); }
  .row-action-item.danger { color: #D0291E; }
  .row-action-item.danger:hover { background: #FDD6DC; }

  .empty-state { padding: 64px 24px; text-align: center; }
  .empty-state-title { font-size: 21px; font-weight: 700; letter-spacing: -.02em; color: var(--ink); margin-bottom: 6px; }
  .empty-state-copy { font-size: 14px; line-height: 1.5; color: var(--ink-mute); }
  .search-prompt { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; text-align: center; gap: 10px; }
  .search-prompt svg { color: var(--spinach); }
  .search-prompt p { font-size: 16px; font-weight: 600; color: var(--ink); line-height: 1.45; margin: 0; max-width: 400px; }

  /* ── Add user modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(10,20,15,.46); z-index: 900; display: none; align-items: center; justify-content: center; padding: 24px; }
  .modal-overlay.open { display: flex; }
  .modal-card { background: #fff; border-radius: 12px; width: 560px; max-width: 100%; max-height: calc(100vh - 80px); display: flex; flex-direction: column; box-shadow: 0 24px 64px rgba(0,0,0,.22); overflow: hidden; }
  .modal-header { padding: 20px 24px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-shrink: 0; }
  .modal-title { font-size: 21px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
  .modal-close { background: none; border: none; cursor: pointer; color: var(--ink-mute); padding: 4px; border-radius: 4px; display: flex; align-items: center; transition: color .13s; flex-shrink: 0; }
  .modal-close:hover { color: var(--ink); }
  .modal-body { padding: 20px 24px 22px; overflow-y: auto; flex: 1; }
  .modal-foot { padding: 14px 24px; border-top: 1px solid var(--rule); display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-shrink: 0; }
  .add-user-result-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .add-user-result-row:last-child { border-bottom: none; }
  .add-user-result-info { flex: 1; min-width: 0; }
  .add-user-result-name { font-size: 14px; font-weight: 500; color: var(--ink); }
  .add-user-result-meta { font-size: 12px; color: var(--ink-mute); margin-top: 2px; }
  .btn-secondary-sm { min-height: 40px; padding: 0 16px; border: 1px solid #E2FFE6; border-radius: 6px; background: #E2FFE6; color: var(--seaweed); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background-color .15s ease; }
  .btn-secondary-sm:hover { background: #C6F2CE; }
  .create-user-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; font-size: 14px; color: var(--ink-mute); }
  .cancel-link { font-size: 14px; font-weight: 600; color: var(--ink-mute); cursor: pointer; background: none; border: none; font-family: inherit; transition: color .13s; }
  .cancel-link:hover { color: var(--ink); }

  .btn-primary {
    min-height: 40px; padding: 0 16px; border: 1px solid var(--nomni-green); border-radius: 6px;
    background: var(--nomni-green); color: var(--seaweed); font-size: 14px; font-weight: 600; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; cursor: pointer;
    transition: background-color .18s ease, color .18s ease, border-color .18s ease, transform .16s ease;
  }
  .btn-primary:hover { background: var(--seaweed); color: var(--nomni-green); border-color: var(--seaweed); }
  .btn-primary:active { transform: scale(.96); }

  /* ── Toast ── */
  #hqToast { position: fixed; right: 28px; top: 78px; z-index: 1100; min-width: 300px; display: flex; align-items: center; gap: 14px; padding: 15px 18px; border-radius: 4px; border: 1px solid #AFE7C2; background: #E2FFE6; box-shadow: 0 16px 44px rgba(10,20,15,.16); color: var(--seaweed); opacity: 0; transform: translateY(-8px); pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
  #hqToast.show { opacity: 1; transform: translateY(0); }
  .hq-toast-check { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: #0BBE3F; color: #fff; font-size: 27px; line-height: 1; flex: 0 0 auto; }
  .hq-toast-title { display: block; font-size: 14px; font-weight: 800; margin-bottom: 2px; }
  .hq-toast-copy { display: block; color: var(--seaweed); font-size: 14px; }

  /* ── User menu ── */
  .user-wrap { position: relative; }
  .user-menu { position: absolute; top: calc(100% + 8px); right: 0; width: 248px; background: #fff; color: var(--ink); border-radius: 10px; box-shadow: 0 14px 40px rgba(10,20,15,.22), 0 2px 8px rgba(10,20,15,.08); display: none; z-index: 200; overflow: hidden; }
  .user-menu.open { display: block; }
  .user-menu-header { padding: 14px 16px 12px; }
  .user-menu-name { font-size: 14px; font-weight: 600; }
  .user-menu-email { font-size: 12px; color: var(--ink-mute); margin-top: 2px; }
  .user-menu-divider { height: 1px; background: var(--rule); }
  .user-menu-section { padding: 6px 0; }
  .user-menu-item { display: flex; align-items: center; gap: 10px; padding: 9px 16px; font-size: 14px; color: var(--ink); text-decoration: none; cursor: pointer; transition: background .1s; white-space: nowrap; }
  .user-menu-item:hover { background: #f3f4f6; }
  .user-menu-item.logout { color: #e53535; }

  @media (max-width: 1280px) {
    .app { grid-template-columns: 56px 1fr; }
    .sidebar { position: fixed; top: 56px; left: 0; width: 56px; height: calc(100vh - 56px); overflow: hidden; transition: width 0.2s ease; z-index: 4; }
    .sidebar:hover { width: 220px; box-shadow: 2px 0 16px rgba(0,0,0,.25); }
    .nav a span { display: none; }
    .sidebar:hover .nav a span { display: inline; }
  }

  /* Procure-style Admin side navigation */
  .app { grid-template-columns: 232px 1fr; }
  .sidebar { background: #F5F5F5; color: #1A1F2B; }
  .nav { margin-top: 4px; padding: 6px 10px; flex: 1; }
  .nav a { gap: 12px; padding: 10px 12px; min-height: 40px; box-sizing: border-box; color: #1A1F2B; border: 0; border-radius: 6px; font-size: 14px; font-weight: 400; transition: background .15s, color .15s; }
  .nav a svg { width: 18px; height: 18px; color: #888; transition: color .15s; }
  .nav a:hover { color: #1A1F2B; background: rgba(0,0,0,.05); }
  .nav a:hover svg { color: #888; }
  .nav a.active { color: var(--seaweed); background: rgba(42,200,100,.14); border: 0; font-weight: 600; padding-left: 12px; }
  .nav a.active svg { color: var(--spinach); }
  .nav .badge { background: var(--nomni-green); color: var(--seaweed); }
  @media (max-width: 1280px) {
    .app { grid-template-columns: 64px 1fr; }
    .sidebar { width: 64px; }
    .sidebar:hover { width: 232px; box-shadow: 2px 0 12px rgba(0,0,0,.12); }
    .nav a, .nav a.active { padding: 10px 12px; border: 0; }
    .nav .badge { min-width: 8px; width: 8px; height: 8px; padding: 0; font-size: 0; margin-left: 4px; }
    .sidebar:hover .nav .badge { min-width: 18px; width: auto; height: 18px; padding: 0 5px; font-size: 10px; margin-left: auto; }
  }

  /* Nomni Green Procure Admin top bar */
  .topbar { background: var(--nomni-green); color: var(--seaweed); border-bottom: none; box-shadow: none; }
  .brand-sub { color: var(--seaweed); font-size: 21px; font-weight: 500; }
  .topbar .user { color: var(--seaweed); }
  .topbar-avt, .topbar .avatar { background: var(--seaweed); color: var(--nomni-green); }
  .help-btn { color: rgba(14,55,39,.78); }
  .help-btn:hover { background: rgba(14,55,39,.10); color: var(--seaweed); }
</style>
</head>
<body>
<div class="app">

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">
        <img class="brand-logo-img" src="assets/nomni_full_greenbar.svg" alt="nomni" />
        <div class="brand-sub">Procure Admin</div>
      </div>
    </div>
    <div class="topbar-right">
      <a href="https://support.zeemart.co/en/" target="_blank" class="help-btn">
        <span class="material-symbols-outlined" aria-hidden="true">help</span> Help
      </a>
      <div class="user-wrap">
        <div class="user" id="userMenuBtn">
          <div class="topbar-avt">WA</div>
          <span>William Arya</span>
          <span class="chev"></span>
        </div>
        <div class="user-menu" id="userMenu">
          <div class="user-menu-header">
            <div class="user-menu-name">William Arya</div>
            <div class="user-menu-email">william@zeemart.co</div>
          </div>
          <div class="user-menu-divider"></div>
          <div class="user-menu-section">
            <a href="#" class="user-menu-item"><span class="material-symbols-outlined" style="font-size:16px;line-height:1;color:var(--ink-mute)">settings</span>Settings</a>
            <a href="#" class="user-menu-item">Change password</a>
          </div>
          <div class="user-menu-divider"></div>
          <div class="user-menu-section">
            <a href="#" class="user-menu-item logout">Logout</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">
    <nav class="nav" aria-label="Primary">
      <a href="#">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="1.5"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
        <span>Orders</span>
      </a>
      <a href="#">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 13h6M9 17h4"/></svg>
        <span>Invoices</span>
      </a>
      <a href="#">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V6m5 14V10m5 10V4m5 16v-8"/></svg>
        <span>Reports</span>
      </a>
      <a href="#">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12V22H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
        <span>Promotions</span>
      </a>
      <a href="Admin - Buyers.html#outlet-groups" class="active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Buyers</span>
      </a>
      <a href="#">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M12 12v3M9 12h6"/></svg>
        <span>Suppliers</span>
      </a>
      <a href="#">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span>Notifications</span><span class="badge">4</span>
      </a>
      <a href="Admin - Buyer User.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        <span>Users</span>
      </a>
    </nav>
  </aside>

  <!-- Main -->
  <main class="main">

    <div class="breadcrumb">
      <a href="Admin - HQ Settings.html" class="back-link" id="backLink">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        <span id="backLinkLabel">Garden Cuisine HQ</span>
      </a>
    </div>

    <div class="page-head">
      <div>
        <h1 class="page-title">Users</h1>
      </div>
      <button class="btn-primary" id="addUserBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        Add user
      </button>
    </div>
    <div class="title-divider"></div>

    <div class="filter-row">
      <div class="ml-search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" color="var(--ink-mute)"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" class="ml-search-input" id="userSearch" placeholder="Search users…" oninput="renderHqUsers()" />
      </div>
    </div>

    <div style="border:1px solid var(--rule);border-radius:8px;overflow:clip">
      <table class="ml-table">
        <thead id="userTableHead">
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th style="width:100px">HQ Owner</th>
            <th style="width:90px">Status</th>
            <th style="width:120px">Last active</th>
            <th style="width:48px"></th>
          </tr>
        </thead>
        <tbody id="userBody"></tbody>
      </table>
    </div>

  </main>
</div>

<!-- ── Add user modal ── -->
<div class="modal-overlay" id="addUserOverlay" onclick="if(event.target===this)closeAddUserModal()">
  <div class="modal-card">
    <div class="modal-header">
      <h2 class="modal-title">Add user</h2>
      <button class="modal-close" onclick="closeAddUserModal()" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="ml-search-wrap" style="width:100%;margin-bottom:4px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" color="var(--ink-mute)"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" class="ml-search-input" id="addUserSearch" placeholder="Search by name or email" oninput="renderAddUserResults()" style="width:100%" />
      </div>
      <div id="addUserResults"></div>
    </div>
  </div>
</div>

<div id="hqToast" role="status" aria-live="polite">
  <span class="hq-toast-check" aria-hidden="true">✓</span>
  <span><span class="hq-toast-title" id="hqToastTitle">Success</span><span class="hq-toast-copy" id="hqToastCopy"></span></span>
</div>

<script>
  document.getElementById('userMenuBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    document.getElementById('userMenu').classList.toggle('open');
  });
  document.addEventListener('click', function() { document.getElementById('userMenu').classList.remove('open'); });

  // Prototype directory of users linked to HQs. In production this would be scoped server-side per HQ.
  var HQ_USERS = [
    { hq: 'Garden Cuisine HQ', name: 'Priya Nair', jobTitle: 'Operations Manager', email: 'priya.nair@gardencuisine.sg', hqOwner: true, active: true, lastActive: '10 Jun 2026' },
    { hq: 'Garden Cuisine HQ', name: 'Marcus Tan', jobTitle: 'Regional Chef', email: 'marcus.tan@gardencuisine.sg', hqOwner: false, active: true, lastActive: '08 Jun 2026' },
    { hq: 'Garden Cuisine HQ', name: 'Aisyah Rahman', jobTitle: 'Finance Lead', email: 'aisyah.rahman@gardencuisine.sg', hqOwner: false, active: true, lastActive: '05 Jun 2026' },
    { hq: 'Garden Cuisine HQ', name: 'Wei Chen', jobTitle: 'Supply Chain Analyst', email: 'wei.chen@gardencuisine.sg', hqOwner: false, active: false, lastActive: '02 May 2026' }
  ];

  // Existing Procure/outlet accounts not yet linked to any HQ — searched when adding a user, so we
  // link the existing account instead of creating a duplicate.
  var PLATFORM_USERS = [
    { name: 'James Lim', jobTitle: 'Store Manager', email: 'james.lim@chargrilloutlets.sg', outlet: 'Chargrill Outlets' },
    { name: 'Nadia Yusof', jobTitle: 'Assistant Manager', email: 'nadia.yusof@familydining.sg', outlet: 'Family Dining Express' },
    { name: 'Kevin Ong', jobTitle: 'Head Chef', email: 'kevin.ong@chargrilloutlets.sg', outlet: 'Chargrill Outlets' },
    { name: 'Farah Ismail', jobTitle: 'Inventory Coordinator', email: 'farah.ismail@gardencuisine.sg', outlet: 'Garden Express @ 290' },
    { name: 'Ryan Teo', jobTitle: 'Duty Manager', email: 'ryan.teo@familydining.sg', outlet: 'Family Dining Express' }
  ];

  function currentHqName() {
    var hq = new URLSearchParams(window.location.search).get('hq');
    return hq && hq.trim() ? hq.trim() : 'Garden Cuisine HQ';
  }
  function backUrl() {
    var back = new URLSearchParams(window.location.search).get('back');
    if (back && back.trim()) return back.trim();
    // No explicit return route (e.g. a direct/bookmarked link) — Admin - HQ Settings.html still
    // knows how to relabel itself for a plain ?hq= name, so fall back to that instead of losing it.
    return 'Admin - HQ Settings.html?hq=' + encodeURIComponent(currentHqName());
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }

  function toggleRowActions(btn) {
    var menu = btn.nextElementSibling;
    var isOpen = menu.classList.contains('open');
    document.querySelectorAll('.row-actions-menu.open').forEach(function(m) { m.classList.remove('open'); m.removeAttribute('style'); });
    if (!isOpen) {
      var r = btn.getBoundingClientRect();
      menu.style.position = 'fixed';
      menu.style.top = (r.bottom + 4) + 'px';
      menu.style.right = (window.innerWidth - r.right) + 'px';
      menu.style.left = 'auto';
      menu.classList.add('open');
    }
  }
  document.addEventListener('click', function() {
    document.querySelectorAll('.row-actions-menu.open').forEach(function(m) { m.classList.remove('open'); m.removeAttribute('style'); });
  });

  function showHqToast(title, copy) {
    var t = document.getElementById('hqToast');
    document.getElementById('hqToastTitle').textContent = title;
    document.getElementById('hqToastCopy').textContent = copy || '';
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2800);
  }

  function renderHqUsers() {
    var hqName = currentHqName();
    var q = (document.getElementById('userSearch').value || '').toLowerCase();
    var rows = HQ_USERS.filter(function(u) {
      if (u.hq !== hqName) return false;
      if (q && u.name.toLowerCase().indexOf(q) === -1 && u.email.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });

    var body = document.getElementById('userBody');
    document.getElementById('userTableHead').hidden = !rows.length;
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="6"><div class="empty-state"><div class="empty-state-title">No users linked to this HQ</div><div class="empty-state-copy">Click Add user to link someone to ' + escapeHtml(hqName) + '.</div></div></td></tr>';
      return;
    }

    body.innerHTML = rows.map(function(u) {
      var idx = HQ_USERS.indexOf(u);
      return '<tr' + (u.active ? '' : ' class="ml-inactive"') + '>' +
        '<td><div class="ml-item-name">' + escapeHtml(u.name) + '</div><div class="ml-item-sub">' + escapeHtml(u.jobTitle) + '</div></td>' +
        '<td>' + escapeHtml(u.email) + '</td>' +
        '<td>' + (u.hqOwner ? '<span class="chip chip-owner">Owner</span>' : '<span style="color:var(--ink-mute)">—</span>') + '</td>' +
        '<td>' + (u.active ? '<span class="chip chip-active">Active</span>' : '<span class="chip chip-inactive">Inactive</span>') + '</td>' +
        '<td style="color:var(--ink-mute)">' + escapeHtml(u.lastActive) + '</td>' +
        '<td><div class="row-actions-wrap"><button class="btn-row-actions" onclick="event.stopPropagation();toggleRowActions(this)">•••</button>' +
          '<div class="row-actions-menu">' +
            '<div class="row-action-item" onclick="editHqUser(' + idx + ')">Edit</div>' +
            '<div class="row-action-item" onclick="toggleHqUserActive(' + idx + ')">' + (u.active ? 'Deactivate' : 'Activate') + '</div>' +
            '<div class="row-action-item danger" onclick="removeHqUser(' + idx + ')">Remove HQ access</div>' +
          '</div></div></td>' +
      '</tr>';
    }).join('');
  }

  function editHqUser(idx) {
    var u = HQ_USERS[idx];
    var params = new URLSearchParams();
    params.set('hq', u.hq);
    params.set('name', u.name);
    params.set('jobTitle', u.jobTitle);
    params.set('email', u.email);
    params.set('owner', u.hqOwner ? '1' : '0');
    params.set('back', 'Admin - HQ Users.html' + window.location.search);
    window.location.href = 'Admin - Buyer User.html?' + params.toString();
  }

  function toggleHqUserActive(idx) {
    var u = HQ_USERS[idx];
    u.active = !u.active;
    renderHqUsers();
    showHqToast(u.active ? 'User activated' : 'User deactivated', u.name + (u.active ? ' can now access this HQ.' : ' can no longer access this HQ.'));
  }

  function removeHqUser(idx) {
    var u = HQ_USERS[idx];
    if (u.hqOwner) { showHqToast('Can\'t remove an HQ Owner', 'Ask a Nomni Admin to change ownership first.'); return; }
    if (!window.confirm('Remove ' + u.name + '\'s access to ' + u.hq + '?')) return;
    HQ_USERS.splice(idx, 1);
    renderHqUsers();
    showHqToast('HQ access removed', u.name + ' can no longer access this HQ.');
  }

  function openAddUserModal() {
    document.getElementById('addUserSearch').value = '';
    renderAddUserResults();
    document.getElementById('addUserOverlay').classList.add('open');
    setTimeout(function() { document.getElementById('addUserSearch').focus(); }, 80);
  }
  function closeAddUserModal() {
    document.getElementById('addUserOverlay').classList.remove('open');
  }
  function linkedEmailsForCurrentHq() {
    var hqName = currentHqName();
    return new Set(HQ_USERS.filter(function(u) { return u.hq === hqName; }).map(function(u) { return u.email.toLowerCase(); }));
  }
  function renderAddUserResults() {
    var q = (document.getElementById('addUserSearch').value || '').trim().toLowerCase();
    var linked = linkedEmailsForCurrentHq();
    var results = document.getElementById('addUserResults');
    var createAction = '<div class="create-user-row"><span>Not listed?</span>' +
      '<button class="btn-secondary-sm" onclick="createNewHqUser()">Create user</button></div>';

    if (q.length < 2) {
      results.innerHTML = '<div class="search-prompt">' +
        '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>' +
        '<p>Search an existing Procure user by name or email</p></div>';
      return;
    }
    var matches = PLATFORM_USERS.filter(function(u) {
      if (linked.has(u.email.toLowerCase())) return false;
      return u.name.toLowerCase().indexOf(q) > -1 || u.email.toLowerCase().indexOf(q) > -1;
    });
    if (!matches.length) {
      results.innerHTML = '<div style="padding:24px 0 8px;text-align:center;color:var(--ink-mute);font-size:14px">No matching users found.</div>' + createAction;
      return;
    }
    results.innerHTML = matches.map(function(u) {
      return '<div class="add-user-result-row">' +
        '<div class="add-user-result-info"><div class="add-user-result-name">' + escapeHtml(u.name) + '</div><div class="add-user-result-meta">' + escapeHtml(u.jobTitle) + ' · ' + escapeHtml(u.email) + '</div></div>' +
        '<button class="btn-secondary-sm" onclick="linkExistingUserToHq(\'' + u.email.replace(/'/g, "\\'") + '\')">Add to HQ</button>' +
      '</div>';
    }).join('') + createAction;
  }
  function linkExistingUserToHq(email) {
    var platformUser = PLATFORM_USERS.find(function(u) { return u.email === email; });
    if (!platformUser) return;
    HQ_USERS.push({
      hq: currentHqName(), name: platformUser.name, jobTitle: platformUser.jobTitle, email: platformUser.email,
      hqOwner: false, active: true, lastActive: 'Just now'
    });
    closeAddUserModal();
    renderHqUsers();
    showHqToast('User added', platformUser.name + ' now has access to ' + currentHqName() + '.');
  }
  function createNewHqUser() {
    var params = new URLSearchParams();
    params.set('hq', currentHqName());
    params.set('back', 'Admin - HQ Users.html' + window.location.search);
    window.location.href = 'Admin - Buyer User.html?' + params.toString();
  }

  document.getElementById('addUserBtn').addEventListener('click', openAddUserModal);

  (function init() {
    var hqName = currentHqName();
    document.getElementById('backLink').href = backUrl();
    document.getElementById('backLinkLabel').textContent = hqName;
    renderHqUsers();
  })();
</script>
</body>
</html>
